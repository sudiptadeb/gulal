<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>gulal playground</title>
<style>
  :root { --gp-bg: #ffffff; --gp-fg: #15171a; --gp-muted: #5b616b; --gp-line: rgba(20, 24, 30, .14); --gp-card: #f5f6f8;
    --gp-font: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; --gp-mono: ui-monospace, Menlo, monospace; color-scheme: light; }
  @media (prefers-color-scheme: dark) { :root { --gp-bg: #121315; --gp-fg: #e8eaed; --gp-muted: #9aa1aa; --gp-line: rgba(255, 255, 255, .14); --gp-card: #1b1d20; color-scheme: dark; } }
  body { margin: 0; background: var(--gp-bg); color: var(--gp-fg); font-family: var(--gp-font); }
  main { max-width: 1000px; margin: 0 auto; padding: 28px 16px 64px; display: grid; gap: 24px; }
  h1 { margin: 0; font-size: 24px; }
  main > p { margin: 0; color: var(--gp-muted); max-width: 70ch; }
</style>
</head>
<body>
<main>
  <h1>gulal</h1>
  <p>Colours made for where they sit. Serve the repo's root (for example <code>npx serve .</code>) after <code>npm run build</code> in <code>js/</code>, and open <code>/playground/</code>.</p>
  <div id="app"></div>
</main>
<script type="module">
  import * as lib from '../js/dist/gulal.js';
  import { mount } from './playground.js';
  mount(document.getElementById('app'), lib);
</script>
</body>
</html>
